[build-system]
requires = ["setuptools>=82"]
build-backend = "setuptools.build_meta"

[project]
name = "pyshindo"
version = "0.2.0"
description = "Reference and real-time algorithms for Japanese instrumental seismic intensity"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "PATENTS.md"]
authors = [
  { name = "pyshindo contributors" },
]
keywords = [
  "earthquake",
  "instrumental-seismic-intensity",
  "seismic-intensity",
  "signal-processing",
  "real-time",
  "JMA",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
]

[project.urls]
Repository = "https://github.com/aldichollow/pyshindo"
Documentation = "https://github.com/aldichollow/pyshindo#readme"
Issues = "https://github.com/aldichollow/pyshindo/issues"
Changelog = "https://github.com/aldichollow/pyshindo/blob/main/CHANGELOG.md"

[project.optional-dependencies]
plot = ["plotly>=5.24,<7"]
obspy = ["obspy>=1.4,<2"]
dev = [
  "build>=1.2",
  # Running the "# %%" examples in an interactive window / notebook.
  "ipykernel>=7.3",
  "mypy>=1.10",
  "nbformat>=5.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.8",
  "scipy-stubs>=1.12",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyshindo = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = [
  "B",
  "E",
  "F",
  "I",
  "N",
  "SIM",
  "UP",
]
ignore = ["N802", "N803", "N806"]

[tool.ruff.lint.per-file-ignores]
"examples/*.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "plotly.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "obspy.*"
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["pyshindo"]

[tool.coverage.report]
show_missing = true
skip_covered = true
